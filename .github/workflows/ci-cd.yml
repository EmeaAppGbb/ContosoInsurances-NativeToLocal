# ============================================================================
# Contoso Insurance — CI/CD Pipeline (Azure Local Connected Mode)
# ============================================================================
#
# MIGRATION NOTE (from main branch):
# This pipeline was updated for Azure Local connected mode deployment:
#
# 1. BUILD & TEST — UNCHANGED. Same .NET build, same tests.
# 2. BUILD IMAGES — UNCHANGED. Same ACR, same container images.
# 3. DEPLOY — CHANGED:
#    - Uses `az connectedk8s proxy` instead of `az aks get-credentials`
#    - Deploys to Arc-enabled K8s instead of AKS
#    - Alternative: Flux GitOps handles deployment automatically
#    - ACR pull secret must be pre-configured on the cluster
#
# MIGRATION (April 2026):
#    - Removed NGINX Ingress / MetalLB deployment steps (both RETIRED March 2026)
#    - Added Gateway API CRD installation step (required for AGC + ALB Controller)
#    - AGC resource ID is substituted into web-deployment.yaml for Gateway annotation
#    - Traffic now flows: Internet → AGC (Azure) → Arc tunnel → on-prem pods
#
# The key insight: APPLICATION CODE IS UNCHANGED. The same containers that
# ran on AKS in Azure now run on Arc-enabled K8s on Azure Local.
# ============================================================================

name: CI/CD — Build and Deploy (Azure Local Connected)

on:
  push:
    branches: [local-connected]
  pull_request:
    branches: [local-connected]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME || 'dev' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-dev' }}

jobs:
  # --------------------------------------------------------------------------
  # Build & Test — UNCHANGED from cloud deployment
  # --------------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ContosoInsurance.slnx

      - name: Build
        run: dotnet build ContosoInsurance.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ContosoInsurance.slnx --no-build --configuration Release --verbosity normal --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

  # --------------------------------------------------------------------------
  # Build Container Images & Push to ACR — UNCHANGED from cloud deployment
  # Same images, same registry, same tags
  # --------------------------------------------------------------------------
  build-images:
    name: Build Container Images
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/local-connected'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR details
        id: acr
        run: |
          ACR_NAME=$(az acr list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[0].name' -o tsv)
          ACR_LOGIN_SERVER=$(az acr show --name $ACR_NAME --query loginServer -o tsv)
          echo "name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT

      - name: ACR Login
        run: az acr login --name ${{ steps.acr.outputs.name }}

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Web Frontend
        run: |
          docker build -f src/ContosoInsurance.Web/Dockerfile -t ${{ steps.acr.outputs.login_server }}/contoso-insurance/webfrontend:${{ steps.meta.outputs.tag }} .
          docker push ${{ steps.acr.outputs.login_server }}/contoso-insurance/webfrontend:${{ steps.meta.outputs.tag }}

      - name: Build and push API
        run: |
          docker build -f src/ContosoInsurance.Api/Dockerfile -t ${{ steps.acr.outputs.login_server }}/contoso-insurance/api:${{ steps.meta.outputs.tag }} .
          docker push ${{ steps.acr.outputs.login_server }}/contoso-insurance/api:${{ steps.meta.outputs.tag }}

      - name: Build and push Worker
        run: |
          docker build -f src/ContosoInsurance.Worker/Dockerfile -t ${{ steps.acr.outputs.login_server }}/contoso-insurance/worker:${{ steps.meta.outputs.tag }} .
          docker push ${{ steps.acr.outputs.login_server }}/contoso-insurance/worker:${{ steps.meta.outputs.tag }}

  # --------------------------------------------------------------------------
  # Deploy to Arc-enabled Kubernetes on Azure Local
  # --------------------------------------------------------------------------
  # CHANGED from cloud deployment:
  # - Uses `az connectedk8s proxy` instead of `az aks get-credentials`
  # - The Arc proxy creates a secure tunnel to the on-premises cluster
  # - Alternative: Let Flux GitOps handle deployment (no kubectl needed)
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to Arc-enabled K8s
    needs: build-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # CHANGE: Use Arc connected cluster proxy instead of AKS credentials
      # The Arc proxy creates a secure reverse tunnel to the on-premises cluster
      - name: Connect to Arc-enabled cluster
        run: |
          # Install connectedk8s extension if not present
          az extension add --name connectedk8s --yes || true
          # Get connected cluster name
          ARC_CLUSTER=$(az connectedk8s list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[0].name' -o tsv)
          echo "Connecting to Arc cluster: $ARC_CLUSTER"
          # Start proxy in background (creates kubectl context)
          az connectedk8s proxy --name $ARC_CLUSTER --resource-group ${{ env.AZURE_RESOURCE_GROUP }} &
          sleep 10  # Wait for proxy to establish

      - name: Get deployment details
        id: details
        run: |
          ACR_LOGIN_SERVER=$(az acr list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[0].loginServer' -o tsv)
          APPINSIGHTS_CS=$(az monitor app-insights component show --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[0].connectionString' -o tsv)
          KV_NAME=$(az keyvault list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[0].name' -o tsv)
          SQL_CS=$(az keyvault secret show --vault-name $KV_NAME --name sql-connection-string --query value -o tsv)
          RABBITMQ_PW=$(az keyvault secret show --vault-name $KV_NAME --name rabbitmq-password --query value -o tsv)
          ARC_CLUSTER=$(az connectedk8s list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[0].name' -o tsv)
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT
          echo "appinsights_cs=$APPINSIGHTS_CS" >> $GITHUB_OUTPUT
          echo "arc_cluster=$ARC_CLUSTER" >> $GITHUB_OUTPUT
          echo "::add-mask::$SQL_CS"
          echo "sql_cs=$SQL_CS" >> $GITHUB_OUTPUT
          echo "::add-mask::$RABBITMQ_PW"
          echo "rabbitmq_pw=$RABBITMQ_PW" >> $GITHUB_OUTPUT

      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Deploy ConfigMap
        run: |
          sed -e "s|__APPINSIGHTS_CONNECTION_STRING__|${{ steps.details.outputs.appinsights_cs }}|g" \
              -e "s|__ARC_CLUSTER_NAME__|${{ steps.details.outputs.arc_cluster }}|g" \
              k8s/configmap.yaml | kubectl apply -f -

      - name: Deploy Secrets
        run: |
          sed -e "s|__SQL_CONNECTION_STRING__|${{ steps.details.outputs.sql_cs }}|g" \
              -e "s|__RABBITMQ_PASSWORD__|${{ steps.details.outputs.rabbitmq_pw }}|g" \
              k8s/secrets.yaml | kubectl apply -f -

      # NEW: Ensure ACR pull secret exists
      - name: Ensure ACR pull secret
        run: |
          if ! kubectl get secret acr-pull-secret -n contoso-insurance 2>/dev/null; then
            echo "WARNING: ACR pull secret not found. Create it manually:"
            echo "  kubectl create secret docker-registry acr-pull-secret ..."
          fi

      - name: Deploy RabbitMQ
        run: kubectl apply -f k8s/rabbitmq-deployment.yaml

      # MIGRATION: Install Gateway API CRDs (required for AGC + ALB Controller)
      # These CRDs define Gateway and HTTPRoute resources used in web-deployment.yaml.
      # Replaces the NGINX IngressClass that was previously auto-installed.
      - name: Install Gateway API CRDs
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml

      - name: Deploy application
        env:
          TAG: ${{ needs.build-images.outputs.image_tag }}
          ACR: ${{ steps.details.outputs.acr_login_server }}
        run: |
          # Get AGC resource ID for Gateway API annotation
          AGC_ID=$(az network traffic-controller list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query '[0].id' -o tsv 2>/dev/null || echo "")
          for manifest in k8s/api-deployment.yaml k8s/worker-deployment.yaml k8s/web-deployment.yaml; do
            sed -e "s|__ACR_LOGIN_SERVER__|$ACR|g" \
                -e "s|__TAG__|$TAG|g" \
                -e "s|__AGC_RESOURCE_ID__|$AGC_ID|g" \
                "$manifest" | kubectl apply -f -
          done

      - name: Apply network policies
        run: kubectl apply -f k8s/network-policies.yaml

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/webfrontend -n contoso-insurance --timeout=300s
          kubectl rollout status deployment/api -n contoso-insurance --timeout=300s
          kubectl rollout status deployment/worker -n contoso-insurance --timeout=300s
