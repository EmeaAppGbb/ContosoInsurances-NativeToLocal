---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rabbitmq
  namespace: contoso-insurance
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: publicapi
        - podSelector:
            matchLabels:
              app: backendapi
        - podSelector:
            matchLabels:
              app: worker-claims
        - podSelector:
            matchLabels:
              app: worker-quotes
        - podSelector:
            matchLabels:
              app: worker-projections
      ports:
        - port: 5672
          protocol: TCP
    - from:
        - podSelector: {}
      ports:
        - port: 15672
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
