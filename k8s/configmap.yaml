# ============================================================================
# Shared ConfigMap (Azure Local Connected Mode)
# ============================================================================
#
# MIGRATION NOTE: Added DEPLOYMENT_MODEL and ARC_CLUSTER_NAME for Azure Local.
# APPLICATIONINSIGHTS_CONNECTION_STRING is unchanged — telemetry still goes
# to Azure Monitor in the cloud.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: contoso-config
  namespace: contoso-insurance
data:
  # Populated during deployment from Bicep outputs
  APPLICATIONINSIGHTS_CONNECTION_STRING: "__APPINSIGHTS_CONNECTION_STRING__"
  ASPNETCORE_ENVIRONMENT: "Production"
  # NEW: Azure Local specific configuration
  DEPLOYMENT_MODEL: "azure-local-connected"
  ARC_CLUSTER_NAME: "__ARC_CLUSTER_NAME__"
