# Shared ConfigMap for non-sensitive deployment-time configuration.
# scripts/deploy-all.ps1 resolves the placeholder tokens before applying it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: contoso-config
  namespace: contoso-insurance
data:
  APPLICATIONINSIGHTS_CONNECTION_STRING: "__APPINSIGHTS_CONNECTION_STRING__"
  ASPNETCORE_ENVIRONMENT: "Production"
