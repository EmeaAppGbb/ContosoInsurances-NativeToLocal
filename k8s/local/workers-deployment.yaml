# Workers — Azure Local cluster (process sensitive claims data on-premises)
# ============================================================================
# HYBRID: All workers run on the Azure Local cluster where they process
# sensitive insurance claims, quotes, and projections data. Data never
# leaves the on-premises environment.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-claims
  namespace: contoso-insurance
  labels:
    app: worker-claims
    app.kubernetes.io/part-of: contoso-insurance
    contoso.io/cluster-role: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-claims
  template:
    metadata:
      labels:
        app: worker-claims
    spec:
      containers:
        - name: worker-claims
          image: __ACR_LOGIN_SERVER__/contoso-insurance/worker-claims:__TAG__
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ConnectionStrings__insurancedb
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: SQL_CONNECTION_STRING
            - name: ConnectionStrings__messaging
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: RABBITMQ_CONNECTION_STRING
            - name: RabbitMQ__HostName
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: RabbitMQ__HostName
            - name: RabbitMQ__Port
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: RabbitMQ__Port
            - name: RabbitMQ__VirtualHost
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: RabbitMQ__VirtualHost
            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: RabbitMQ__UserName
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: RabbitMQ__Password
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
