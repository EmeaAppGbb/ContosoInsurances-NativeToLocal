# Azure Local cluster namespace and configuration
apiVersion: v1
kind: Namespace
metadata:
  name: contoso-insurance
  labels:
    app.kubernetes.io/part-of: contoso-insurance
    app.kubernetes.io/managed-by: fleet
    contoso.io/cluster-role: local
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: contoso-insurance
imagePullSecrets:
  - name: acr-pull
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: contoso-config
  namespace: contoso-insurance
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  APPLICATIONINSIGHTS_CONNECTION_STRING: "__APPINSIGHTS_CONNECTION_STRING__"
  ApiBaseUrl: "http://publicapi:8080"
  BackendApiBaseUrl: "http://backendapi:8080"
  BackendApi__BaseUrl: "http://backendapi:8080"
  RabbitMQ__HostName: "rabbitmq"
  RabbitMQ__Port: "5672"
  RabbitMQ__ManagementPort: "15672"
  RabbitMQ__VirtualHost: "/"
  AzureAd__Instance: "__AZURE_AD_INSTANCE__"
  AzureAd__TenantId: "__AZURE_AD_TENANT_ID__"
  AzureAd__Domain: "__AZURE_AD_DOMAIN__"
  BackendPortal__AzureAd__ClientId: "__BACKEND_PORTAL_AZURE_AD_CLIENT_ID__"
  BackendPortal__AzureAd__CallbackPath: "__BACKEND_PORTAL_AZURE_AD_CALLBACK_PATH__"
  BackendApi__AzureAd__ClientId: "__BACKEND_API_AZURE_AD_CLIENT_ID__"
  BackendApi__AzureAd__Audience: "__BACKEND_API_AZURE_AD_AUDIENCE__"
---
apiVersion: v1
kind: Secret
metadata:
  name: contoso-secrets
  namespace: contoso-insurance
type: Opaque
stringData:
  SQL_CONNECTION_STRING: "__SQL_CONNECTION_STRING__"
  RABBITMQ_USERNAME: "guest"
  RABBITMQ_PASSWORD: "__RABBITMQ_PASSWORD__"
  RABBITMQ_CONNECTION_STRING: "amqp://guest:__RABBITMQ_PASSWORD__@rabbitmq.contoso-insurance.svc.cluster.local:5672"
  RabbitMQ__UserName: "guest"
  RabbitMQ__Password: "__RABBITMQ_PASSWORD__"
  BackendPortal__AzureAd__ClientSecret: "__BACKEND_PORTAL_AZURE_AD_CLIENT_SECRET__"
