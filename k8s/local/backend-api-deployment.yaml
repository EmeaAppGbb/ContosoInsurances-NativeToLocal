# Backend API — Azure Local cluster (private, sensitive business logic)
# ============================================================================
# HYBRID: Backend API processes sensitive insurance data and must remain
# on-premises for data sovereignty. Only accessible within the local cluster.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backendapi
  namespace: contoso-insurance
  labels:
    app: backendapi
    app.kubernetes.io/part-of: contoso-insurance
    contoso.io/cluster-role: local
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backendapi
  template:
    metadata:
      labels:
        app: backendapi
    spec:
      containers:
        - name: backendapi
          image: __ACR_LOGIN_SERVER__/contoso-insurance/backendapi:__TAG__
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ConnectionStrings__insurancedb
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: SQL_CONNECTION_STRING
            - name: ConnectionStrings__messaging
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: RABBITMQ_CONNECTION_STRING
            - name: RabbitMQ__HostName
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: RabbitMQ__HostName
            - name: RabbitMQ__Port
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: RabbitMQ__Port
            - name: RabbitMQ__VirtualHost
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: RabbitMQ__VirtualHost
            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: RabbitMQ__UserName
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: RabbitMQ__Password
            - name: AzureAd__Instance
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: AzureAd__Instance
            - name: AzureAd__TenantId
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: AzureAd__TenantId
            - name: AzureAd__Domain
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: AzureAd__Domain
            - name: AzureAd__ClientId
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: BackendApi__AzureAd__ClientId
            - name: AzureAd__Audience
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: BackendApi__AzureAd__Audience
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backendapi
  namespace: contoso-insurance
spec:
  type: ClusterIP
  selector:
    app: backendapi
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
