# ============================================================================
# Web Frontend - the ONLY internet-accessible service (Azure Local Connected)
# ============================================================================
#
# MIGRATION (April 2026):
#   - Removed NGINX Ingress resource (NGINX Ingress Controller RETIRED March 2026)
#   - Added Gateway API resources (Gateway + HTTPRoute) for AGC integration
#   - Service remains ClusterIP - AGC routes traffic via Arc tunnel
#   - imagePullSecrets still needed for ACR auth on Arc-enabled K8s
#
# HOW IT WORKS IN CONNECTED MODE:
#   Internet -> AGC (Azure cloud) -> Arc connectivity tunnel -> on-prem pods
#   The ALB Controller extension on the Arc cluster watches Gateway/HTTPRoute
#   resources and configures AGC automatically. No MetalLB or NGINX needed!
#
# PREREQUISITE: Gateway API CRDs must be installed on the Arc-enabled cluster:
#   kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webfrontend
  namespace: contoso-insurance
  labels:
    app: webfrontend
    app.kubernetes.io/part-of: contoso-insurance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webfrontend
  template:
    metadata:
      labels:
        app: webfrontend
    spec:
      # ACR imagePullSecrets needed on Arc-enabled K8s (no AKS managed identity)
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: webfrontend
          image: __ACR_LOGIN_SERVER__/contoso-insurance/webfrontend:__TAG__
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: services__api__http__0
              value: "http://api-service.contoso-insurance.svc.cluster.local:8080"
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
# ClusterIP service - AGC routes traffic directly to pods via ALB Controller
apiVersion: v1
kind: Service
metadata:
  name: webfrontend-service
  namespace: contoso-insurance
spec:
  type: ClusterIP
  selector:
    app: webfrontend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
# ============================================================================
# Gateway API Resources - replace retired NGINX Ingress (March 2026)
# ============================================================================
# MIGRATION: These Gateway API resources replace the NGINX Ingress resource
# that was previously defined here. The ALB Controller extension on the
# Arc-enabled cluster watches these resources and configures AGC.
#
# KEY ADVANTAGE OF CONNECTED MODE:
# AGC provides Azure-managed L7 routing, WAF, and DDoS protection for on-prem
# workloads WITHOUT exposing any on-prem IPs to the internet. Traffic flows
# through the secure Arc connectivity tunnel (outbound-only from on-prem).
# ============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: contoso-gateway
  namespace: contoso-insurance
  annotations:
    # Links the Gateway to the AGC Traffic Controller deployed by Bicep.
    # Replace __AGC_RESOURCE_ID__ with actual AGC resource ID from Bicep output.
    # CI/CD pipeline handles this substitution.
    alb.networking.azure.io/alb-id: __AGC_RESOURCE_ID__
spec:
  # MIGRATION: gatewayClassName 'azure-alb-external' is the AGC class for
  # public-facing frontends. Works with both AKS and Arc-enabled K8s.
  gatewayClassName: azure-alb-external
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webfrontend-route
  namespace: contoso-insurance
spec:
  parentRefs:
    - name: contoso-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: webfrontend-service
          port: 8080