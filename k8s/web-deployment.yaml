# Web Frontend — the ONLY internet-accessible service
# Exposed via internal LoadBalancer, which App Gateway routes to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webfrontend
  namespace: contoso-insurance
  labels:
    app: webfrontend
    app.kubernetes.io/part-of: contoso-insurance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webfrontend
  template:
    metadata:
      labels:
        app: webfrontend
    spec:
      nodeSelector:
        workload: contoso-insurance
      containers:
        - name: webfrontend
          image: __ACR_LOGIN_SERVER__/contoso-insurance/webfrontend:__TAG__
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: services__api__http__0
              value: "http://api-service.contoso-insurance.svc.cluster.local:8080"
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: webfrontend-service
  namespace: contoso-insurance
  annotations:
    # Internal LB — only App Gateway can reach this from its subnet
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: webfrontend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
