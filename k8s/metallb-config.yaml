# ============================================================================
# MetalLB Configuration — Bare-Metal Load Balancer for Azure Local
# ============================================================================
#
# NEW FILE (not present in cloud deployment on main branch)
#
# WHY: In Azure (cloud), Kubernetes LoadBalancer services automatically get
# public IPs from Azure's infrastructure. On Azure Local (on-premises),
# there is no cloud provider to assign IPs. MetalLB fills this gap by:
#
#   1. Advertising IP addresses on the local network (L2 or BGP mode)
#   2. Assigning external IPs to LoadBalancer-type services
#   3. Responding to ARP requests for the assigned IPs
#
# PREREQUISITE: MetalLB must be installed first:
#   kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml
#
# Then apply this configuration to define the IP pool.
#
# NETWORK PLANNING:
# The IP range below (10.0.18.100-10.0.18.200) must be:
#   - On the same L2 network as the Azure Local cluster nodes
#   - Reserved (not assigned by DHCP to other devices)
#   - Routable from client machines that need to access the app
#   - Documented in the networking module (see infra/modules/networking.bicep)
# ============================================================================

# IP Address Pool — defines the range of IPs MetalLB can assign
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: external-pool
  namespace: metallb-system
spec:
  addresses:
    # Adjust this range to match your Azure Local external network
    # Must be unused IPs on the same L2 network as cluster nodes
    - 10.0.18.100-10.0.18.200

---
# L2Advertisement — MetalLB uses ARP to advertise assigned IPs
# This is the simplest mode and works on any L2 network.
# For larger deployments, consider BGP mode with your network switches.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: external-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - external-pool
