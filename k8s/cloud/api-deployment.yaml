# Public API — cloud cluster intake service
# ============================================================================
# HYBRID: The Public API runs on the cloud cluster as the intake layer.
# It receives customer requests from the web frontend and forwards them to
# on-prem RabbitMQ (via VPN/ExpressRoute) for processing by local workers.
# SQL reads for non-sensitive data (quotes, status) go through the VPN link.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: publicapi
  namespace: contoso-insurance
  labels:
    app: publicapi
    app.kubernetes.io/part-of: contoso-insurance
    contoso.io/cluster-role: cloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: publicapi
  template:
    metadata:
      labels:
        app: publicapi
    spec:
      containers:
        - name: publicapi
          image: __ACR_LOGIN_SERVER__/contoso-insurance/publicapi:__TAG__
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ConnectionStrings__insurancedb
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: SQL_CONNECTION_STRING
            - name: ConnectionStrings__messaging
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: RABBITMQ_CONNECTION_STRING
            - name: RabbitMQ__HostName
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: RabbitMQ__HostName
            - name: RabbitMQ__Port
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: RabbitMQ__Port
            - name: RabbitMQ__VirtualHost
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: RabbitMQ__VirtualHost
            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: RabbitMQ__UserName
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: RabbitMQ__Password
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: publicapi
  namespace: contoso-insurance
spec:
  type: ClusterIP
  selector:
    app: publicapi
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
