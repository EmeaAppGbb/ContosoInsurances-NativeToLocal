apiVersion: apps/v1
kind: Deployment
metadata:
  name: backendapi
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backendapi
  template:
    metadata:
      labels:
        app: backendapi
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: backendapi
          image: __ACR_LOGIN_SERVER__/__REPOSITORY_PREFIX__/backendapi:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
            - name: ConnectionStrings__insurancedb
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: ConnectionStrings__insurancedb
            - name: RabbitMQ__HostName
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: RabbitMQ__HostName
            - name: RabbitMQ__Port
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: RabbitMQ__Port
            - name: RabbitMQ__VirtualHost
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: RabbitMQ__VirtualHost
            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: RABBITMQ_USERNAME
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: RABBITMQ_PASSWORD
            - name: Authentication__Entra__Authority
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: Authentication__Entra__Authority
            - name: Authentication__Entra__Audience
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: Authentication__Entra__Audience
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backendapi
  namespace: __NAMESPACE__
spec:
  selector:
    app: backendapi
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
