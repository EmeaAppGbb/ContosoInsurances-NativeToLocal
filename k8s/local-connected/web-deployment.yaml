apiVersion: apps/v1
kind: Deployment
metadata:
  name: webfrontend
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webfrontend
  template:
    metadata:
      labels:
        app: webfrontend
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: webfrontend
          image: __ACR_LOGIN_SERVER__/__REPOSITORY_PREFIX__/webfrontend:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
            - name: ApiBaseUrl
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: ApiBaseUrl
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: webfrontend
  namespace: __NAMESPACE__
spec:
  selector:
    app: webfrontend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webfrontend
  namespace: __NAMESPACE__
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
spec:
  ingressClassName: nginx
  rules:
    - host: __WEB_HOSTNAME__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webfrontend
                port:
                  number: 8080
