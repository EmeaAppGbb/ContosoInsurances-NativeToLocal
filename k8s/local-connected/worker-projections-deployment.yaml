apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-projections
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-projections
  template:
    metadata:
      labels:
        app: worker-projections
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: worker-projections
          image: __ACR_LOGIN_SERVER__/__REPOSITORY_PREFIX__/worker-projections:__TAG__
          imagePullPolicy: IfNotPresent
          env:
            - name: ConnectionStrings__insurancedb
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: ConnectionStrings__insurancedb
            - name: RabbitMQ__HostName
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: RabbitMQ__HostName
            - name: RabbitMQ__Port
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: RabbitMQ__Port
            - name: RabbitMQ__VirtualHost
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: RabbitMQ__VirtualHost
            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: RABBITMQ_USERNAME
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: RABBITMQ_PASSWORD
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
