# ============================================================================
# NGINX Ingress Controller — Replaces Azure Application Gateway
# ============================================================================
#
# NEW FILE (not present in cloud deployment on main branch)
#
# WHY: Azure Local does not have Application Gateway. NGINX Ingress Controller
# provides equivalent L7 routing capabilities:
#   - Path-based routing
#   - TLS termination
#   - Rate limiting
#   - ModSecurity WAF (equivalent to App Gateway OWASP rules)
#
# This manifest deploys the NGINX Ingress Controller using the official
# community configuration. In production, you may want to install via Helm
# for easier upgrades:
#   helm install ingress-nginx ingress-nginx/ingress-nginx \
#     --namespace ingress-nginx --create-namespace \
#     --set controller.service.type=LoadBalancer
#
# The LoadBalancer service type works with MetalLB (see metallb-config.yaml)
# to allocate an external IP from the Azure Local network.
# ============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
    # Label used by network policies to identify this namespace
    kubernetes.io/metadata.name: ingress-nginx

---
# ServiceAccount for the NGINX Ingress Controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress-nginx
  namespace: ingress-nginx

---
# NGINX Ingress Controller Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress-nginx
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: ingress-nginx
      containers:
        - name: controller
          image: registry.k8s.io/ingress-nginx/controller:v1.12.1
          args:
            - /nginx-ingress-controller
            - --publish-service=$(POD_NAMESPACE)/ingress-nginx-controller
            - --election-id=ingress-nginx-leader
            - --controller-class=k8s.io/ingress-nginx
            - --ingress-class=nginx
            - --configmap=$(POD_NAMESPACE)/ingress-nginx-controller
            # Enable ModSecurity WAF (replaces App Gateway WAF)
            - --enable-modsecurity
            - --enable-owasp-modsecurity-crs
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10254
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 10254
            initialDelaySeconds: 10
            periodSeconds: 10

---
# ConfigMap for NGINX configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
data:
  # Security headers (equivalent to what App Gateway WAF provides)
  use-forwarded-headers: "true"
  hide-headers: "X-Powered-By,Server"
  ssl-redirect: "false"

---
# LoadBalancer Service — MetalLB assigns an external IP from the Azure Local network
# This replaces the Application Gateway public IP
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
  annotations:
    # MetalLB will assign an IP from its configured pool
    metallb.universe.tf/address-pool: external-pool
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/component: controller
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP

---
# IngressClass resource — tells K8s this is the default ingress controller
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: k8s.io/ingress-nginx
