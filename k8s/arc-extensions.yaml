# ============================================================================
# Arc Extensions Documentation — Required Arc K8s Extensions
# ============================================================================
#
# NEW FILE (not present in cloud deployment on main branch)
#
# This file documents and provides example configurations for the Azure Arc
# extensions that are deployed via Bicep (see infra/modules/arc-kubernetes.bicep)
# and their Kubernetes-side configurations.
#
# In the cloud AKS deployment, these capabilities were built into AKS addons:
#   - omsagent addon → Azure Monitor Container Insights extension
#   - azurepolicy addon → Azure Policy extension
#   - CSI Secrets Store → Key Vault Secrets Provider extension
#   - kubectl apply (CI/CD) → Flux GitOps extension
# ============================================================================

# ---------------------------------------------------------------------------
# SecretProviderClass — Key Vault Secrets Provider
# ---------------------------------------------------------------------------
# This tells the Arc Key Vault Secrets Provider extension which secrets to
# sync from Azure Key Vault to Kubernetes Secrets. In the cloud deployment,
# we used static K8s secrets injected by CI/CD. With Arc, secrets are
# automatically synced from Key Vault.
#
# USAGE: Uncomment and configure when the Key Vault Secrets Provider
# extension is installed on the Arc-enabled cluster.
# ---------------------------------------------------------------------------

# apiVersion: secrets-store.csi.x-k8s.io/v1
# kind: SecretProviderClass
# metadata:
#   name: contoso-kv-secrets
#   namespace: contoso-insurance
# spec:
#   provider: azure
#   parameters:
#     usePodIdentity: "false"
#     useVMManagedIdentity: "false"
#     # clientID of the service principal or managed identity with KV access
#     clientID: "__ARC_KV_EXTENSION_CLIENT_ID__"
#     # Key Vault name (from Bicep output AZURE_KEY_VAULT_NAME)
#     keyvaultName: "__KEY_VAULT_NAME__"
#     # Secrets to sync
#     objects: |
#       array:
#         - |
#           objectName: sql-connection-string
#           objectType: secret
#         - |
#           objectName: rabbitmq-password
#           objectType: secret
#     tenantId: "__AZURE_TENANT_ID__"
#   # Sync KV secrets to K8s secrets (so env vars can reference them)
#   secretObjects:
#     - secretName: contoso-secrets
#       type: Opaque
#       data:
#         - objectName: sql-connection-string
#           key: SQL_CONNECTION_STRING
#         - objectName: rabbitmq-password
#           key: RABBITMQ_PASSWORD

---
# ---------------------------------------------------------------------------
# ACR Pull Secret — Image Pull Authentication
# ---------------------------------------------------------------------------
# In the cloud AKS deployment, the AKS kubelet identity had AcrPull role,
# so no explicit pull secret was needed. On Arc-enabled K8s, we need an
# imagePullSecret to authenticate with Azure Container Registry.
#
# CREATE THIS SECRET VIA CLI (do NOT commit actual credentials):
#   kubectl create secret docker-registry acr-pull-secret \
#     --namespace contoso-insurance \
#     --docker-server=<ACR_LOGIN_SERVER> \
#     --docker-username=<SERVICE_PRINCIPAL_ID> \
#     --docker-password=<SERVICE_PRINCIPAL_SECRET> \
#     --docker-email=admin@contoso.com
#
# Or use ACR token-based auth:
#   az acr token create --name arc-pull-token --registry <ACR_NAME> \
#     --scope-map _repositories_pull
# ---------------------------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: acr-pull-secret
  namespace: contoso-insurance
  annotations:
    description: "ACR pull secret — create via kubectl, do not commit credentials"
type: kubernetes.io/dockerconfigjson
data:
  # PLACEHOLDER — replace with actual base64-encoded dockerconfigjson
  # Generated by: kubectl create secret docker-registry (see instructions above)
  .dockerconfigjson: e30=
