# ============================================================================
# Secrets template (Azure Local Connected Mode)
# ============================================================================
#
# MIGRATION NOTE (from main branch):
# 1. SQL_CONNECTION_STRING now targets Arc SQL MI (on-prem) instead of
#    Azure SQL Database (cloud). The format is identical — EF Core doesn't
#    know the difference.
# 2. In production, use the Arc Key Vault Secrets Provider extension to
#    sync secrets from Azure Key Vault instead of static K8s secrets.
#    See k8s/arc-extensions.yaml for the SecretProviderClass example.
# 3. ACR_PULL_SECRET added — this is used by imagePullSecrets in deployments
#    to authenticate with Azure Container Registry (replaces AKS AcrPull role).
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: contoso-secrets
  namespace: contoso-insurance
type: Opaque
stringData:
  SQL_CONNECTION_STRING: "__SQL_CONNECTION_STRING__"
  RABBITMQ_USERNAME: "guest"
  RABBITMQ_PASSWORD: "__RABBITMQ_PASSWORD__"
  RABBITMQ_CONNECTION_STRING: "amqp://guest:__RABBITMQ_PASSWORD__@rabbitmq.contoso-insurance.svc.cluster.local:5672"
  RabbitMQ__UserName: "guest"
  RabbitMQ__Password: "__RABBITMQ_PASSWORD__"
  BackendPortal__AzureAd__ClientSecret: "__BACKEND_PORTAL_AZURE_AD_CLIENT_SECRET__"
