# Secrets template — values are injected from Azure Key Vault during deployment
# In production, use the Azure Key Vault CSI driver instead of static secrets.
# This file is a reference template; do NOT commit actual secret values.
apiVersion: v1
kind: Secret
metadata:
  name: contoso-secrets
  namespace: contoso-insurance
type: Opaque
stringData:
  SQL_CONNECTION_STRING: "__SQL_CONNECTION_STRING__"
  RABBITMQ_PASSWORD: "__RABBITMQ_PASSWORD__"
  RABBITMQ_CONNECTION_STRING: "amqp://guest:__RABBITMQ_PASSWORD__@rabbitmq-service.contoso-insurance.svc.cluster.local:5672"
