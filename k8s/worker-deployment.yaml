# ============================================================================
# Worker — Background processor (Azure Local Connected Mode)
# ============================================================================
#
# MIGRATION NOTE (from main branch):
# 1. Added imagePullSecrets for ACR auth (replaces AKS managed identity)
# 2. Removed nodeSelector (Azure Local nodes may not have same labels)
# 3. SQL connection string now points to Arc SQL MI (on-prem)
# 4. Everything else is UNCHANGED — same container, same env vars
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: contoso-insurance
  labels:
    app: worker
    app.kubernetes.io/part-of: contoso-insurance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: worker
          image: __ACR_LOGIN_SERVER__/contoso-insurance/worker:__TAG__
          env:
            - name: ConnectionStrings__insurancedb
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: SQL_CONNECTION_STRING
            - name: ConnectionStrings__messaging
              valueFrom:
                secretKeyRef:
                  name: contoso-secrets
                  key: RABBITMQ_CONNECTION_STRING
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                configMapKeyRef:
                  name: contoso-config
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
