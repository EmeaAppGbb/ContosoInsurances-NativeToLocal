# Azure Developer CLI (azd) configuration for Contoso Insurance
# Deploys to AKS using custom hooks (Aspire AppHost is dev-time only)
name: contoso-insurance
metadata:
  template: contoso-insurance-aks
infra:
  provider: bicep
  path: infra
  module: main
hooks:
  postprovision:
    shell: pwsh
    run: ./scripts/deploy-all.ps1
    interactive: true
    continueOnError: false
