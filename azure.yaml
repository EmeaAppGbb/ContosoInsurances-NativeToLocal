# ============================================================================
# Azure Developer CLI (azd) configuration — Azure Local Connected Mode
# ============================================================================
#
# MIGRATION NOTE (from main branch):
# The cloud deployment used azd's built-in Aspire/Container Apps integration.
# For Azure Local connected mode:
#
# 1. host changed from 'containerapp' to 'aks' — AZD deploys to K8s
# 2. infra deploys Azure-side resources (ACR, Key Vault, Monitor) + Arc config
# 3. K8s manifests are applied via GitOps (Flux) or CI/CD pipeline
# 4. AZD handles the Azure resource provisioning; K8s deployment is separate
#
# DEPLOYMENT WORKFLOW:
#   1. azd provision — deploys Bicep (Azure resources + Arc extensions)
#   2. azd deploy — builds containers, pushes to ACR
#   3. Flux GitOps (or CI/CD) applies K8s manifests to Arc-enabled cluster
# ============================================================================
name: contoso-insurance
metadata:
  template: contoso-insurance-azure-local-connected
infra:
  provider: bicep
  path: infra
  module: main
# Hook scripts for Azure Local deployment
hooks:
  # After provisioning, configure kubectl context for the Arc-enabled cluster
  postprovision:
    shell: sh
    run: |
      echo "=== Post-Provision: Azure Local Connected Mode ==="
      echo "Azure resources provisioned. Next steps:"
      echo "1. Ensure Arc-connected cluster is accessible"
      echo "2. Create ACR pull secret: kubectl create secret docker-registry acr-pull-secret ..."
      echo "3. Apply K8s manifests or wait for Flux GitOps sync"
      echo ""
      echo "To get Arc cluster credentials:"
      echo "  az connectedk8s proxy --name <cluster> --resource-group <rg>"

